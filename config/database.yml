default: &default
  adapter: postgresql
  encoding: unicode
  pool: <%= ENV.fetch("RAILS_MAX_THREADS") { 5 } %>

development:
  <<: *default
  database: calendarator_development

test:
  <<: *default
  database: calendarator_test

production:
  <<: *default
  database: calendarator_production
  username: calendarator
  password: <%= ENV['CALENDARATOR_DATABASE_PASSWORD'] %>